<script>
  // Configured with your project details
  const SUPABASE_URL = "https://reirnubvmdallsrzqzop.supabase.co"; 
  const SUPABASE_KEY = "sb_publishable_58-m2gaLM6QjRGUPORpM8w_I-vjhwY3";
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  function showStatus(text, type = 'info') {
    const el = document.getElementById('status-msg');
    el.className = `status-${type}`;
    el.innerText = text;
  }

  // Helper: Extract Spreadsheet ID & GID from Google Sheet URL
  function parseSheetDetails(url) {
    const idMatch = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
    const gidMatch = url.match(/[#&?]gid=([0-9]+)/);
    return {
      spreadsheetId: idMatch ? idMatch[1] : null,
      gid: gidMatch ? gidMatch[1] : '0'
    };
  }

  // Fetch public rows directly from Google's GViz API
  async function fetchGoogleSheetData(url) {
    const { spreadsheetId, gid } = parseSheetDetails(url);
    if (!spreadsheetId) throw new Error("Invalid Google Sheet URL.");

    const gvizUrl = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?tqx=out:json&gid=${gid}`;
    const response = await fetch(gvizUrl);
    if (!response.ok) throw new Error("Could not access Google Sheet. Ensure 'Anyone with the link can view' is enabled.");

    const text = await response.text();
    const jsonText = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
    const data = JSON.parse(jsonText);

    const cols = data.table.cols.map(c => (c.label || '').trim().toLowerCase());
    const rows = data.table.rows;

    // Locate column indexes dynamically
    const nameIdx = cols.findIndex(c => c.includes('name') || c.includes('title') || c.includes('event'));
    const dateIdx = cols.findIndex(c => c.includes('date'));
    const timeIdx = cols.findIndex(c => c.includes('time'));
    const linkIdx = cols.findIndex(c => c.includes('link') || c.includes('url') || c.includes('website'));

    const events = [];
    const seenIds = new Set(); // Prevent duplicate IDs in the same fetch batch

    rows.forEach((row) => {
      const c = row.c || [];
      const getValue = (idx) => (idx !== -1 && c[idx] && c[idx].v !== null) ? String(c[idx].v).trim() : '';

      const name = getValue(nameIdx !== -1 ? nameIdx : 0);
      if (!name) return; // Skip empty rows

      const date = getValue(dateIdx !== -1 ? dateIdx : 1) || 'TBD';
      const time = getValue(timeIdx !== -1 ? timeIdx : 2) || 'ALL DAY';
      const link = getValue(linkIdx !== -1 ? linkIdx : 3) || '#';

      // Generate deterministic unique ID using Name + Link
      const id = 'sheet_' + btoa(unescape(encodeURIComponent(name + link))).replace(/=/g, '').slice(-20);

      // --- DEDUPLICATION FIX ---
      if (seenIds.has(id)) return;
      seenIds.add(id);

      events.push({
        id: id,
        name: name,
        start_date: date,
        location: time,
        website: link
      });
    });

    return events;
  }

  async function syncFromGoogleSheet() {
    showStatus("Fetching data from Google Sheet...", "info");
    const url = document.getElementById('sheetUrlInput').value;

    try {
      const events = await fetchGoogleSheetData(url);

      // Fetch existing record statuses to preserve 'applied' or 'not_relevant' flags
      const { data: existing, error: fetchErr } = await db.from('events').select('id, status');
      if (fetchErr) throw fetchErr;

      const existingStatusMap = new Map((existing || []).map(x => [x.id, x.status]));

      const recordsToSave = events.map(e => ({
        id: e.id,
        name: e.name,
        start_date: e.start_date,
        location: e.location,
        website: e.website,
        status: existingStatusMap.get(e.id) || 'active'
      }));

      const { error: upsertErr } = await db.from('events').upsert(recordsToSave, { onConflict: 'id' });
      if (upsertErr) throw upsertErr;

      showStatus(`Synced ${events.length} unique events from Google Sheet successfully!`, "success");
      await loadData();
    } catch (err) {
      handleError(err, "Google Sheet Sync Error: ");
    }
  }

  async function checkForNewEvents() {
    showStatus("Checking Google Sheet for new items...", "info");
    const url = document.getElementById('sheetUrlInput').value;

    try {
      const events = await fetchGoogleSheetData(url);
      const { data: existing, error: fetchErr } = await db.from('events').select('id');
      if (fetchErr) throw fetchErr;

      const existingIds = new Set((existing || []).map(x => x.id));
      const newBody = document.getElementById('new-table');
      newBody.innerHTML = '';
      let newCount = 0;

      for (let e of events) {
        if (!existingIds.has(e.id)) {
          newCount++;
          const cleanName = e.name.replace(/'/g, "\\'");
          newBody.innerHTML += `
            <tr>
              <td>${e.start_date}</td>
              <td><strong>${e.location}</strong></td>
              <td><span class="badge-new">NEW</span> <strong>${e.name}</strong></td>
              <td><a href="${e.website}" target="_blank">Link ↗</a></td>
              <td>
                <button class="btn-action btn-applied" onclick="saveAndSet('${e.id}', '${cleanName}', '${e.start_date}', '${e.location}', '${e.website}', 'applied')">Applied</button>
                <button class="btn-action btn-irrelevant" onclick="saveAndSet('${e.id}', '${cleanName}', '${e.start_date}', '${e.location}', '${e.website}', 'not_relevant')">Not Relevant</button>
              </td>
            </tr>`;
        }
      }

      if (newCount > 0) {
        showStatus(`Found ${newCount} new events! Review them in the top section.`, "success");
      } else {
        showStatus("No new events found. Database is up to date!", "success");
      }
    } catch (err) {
      handleError(err, "Check Error: ");
    }
  }

  async function loadData() {
    try {
      const { data: events, error } = await db.from('events').select('*').order('created_at', { ascending: false });
      if (error) throw error;

      const activeBody = document.getElementById('active-table');
      const processedBody = document.getElementById('processed-table');
      activeBody.innerHTML = '';
      processedBody.innerHTML = '';

      (events || []).forEach(e => {
        const eventTime = e.location || 'ALL DAY';
        if (e.status === 'active') {
          activeBody.innerHTML += `
            <tr>
              <td>${e.start_date || 'TBD'}</td>
              <td><strong>${eventTime}</strong></td>
              <td><strong>${e.name}</strong></td>
              <td><a href="${e.website || '#'}" target="_blank">Link ↗</a></td>
              <td>
                <button class="btn-action btn-applied" onclick="setStatus('${e.id}', 'applied')">Applied</button>
                <button class="btn-action btn-irrelevant" onclick="setStatus('${e.id}', 'not_relevant')">Not Relevant</button>
              </td>
            </tr>`;
        } else {
          const badgeClass = e.status === 'applied' ? 'badge-applied' : 'badge-not_relevant';
          processedBody.innerHTML += `
            <tr>
              <td>${e.start_date || 'TBD'}</td>
              <td>${eventTime}</td>
              <td>${e.name}</td>
              <td><a href="${e.website || '#'}" target="_blank">Link ↗</a></td>
              <td><span class="badge-status ${badgeClass}">${e.status.replace('_', ' ')}</span></td>
            </tr>`;
        }
      });
    } catch (err) {
      handleError(err, "Database Error: ");
    }
  }

  async function setStatus(id, status) {
    await db.from('events').update({ status }).eq('id', id);
    await loadData();
  }

  async function saveAndSet(id, name, start_date, time, website, status) {
    await db.from('events').upsert({ id, name, start_date, location: time, website, status }, { onConflict: 'id' });
    await loadData();
    document.getElementById('new-table').innerHTML = '';
  }

  function handleError(err, prefix = '') {
    if (err.message && (err.message.includes('Failed to fetch') || err.name === 'TypeError')) {
      showStatus("Cannot reach Supabase! Ensure your project is active and 'events' table exists.", "error");
    } else {
      showStatus(prefix + err.message, "error");
    }
  }

  loadData();
</script>
