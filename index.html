<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOKEN2049 Daily Side Events</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">
    <div class="max-w-4xl mx-auto">
        <header class="mb-8 border-b border-slate-800 pb-4">
            <h1 class="text-3xl font-bold text-white mb-2">⚡ TOKEN2049 Side Events Tracker</h1>
            <p class="text-slate-400">Events grouped by the date they were newly discovered.</p>
        </header>

        <div id="content" class="space-y-8">Loading events...</div>
    </div>

    <script>
        async function fetchEvents() {
            try {
                const res = await fetch('./events.json');
                const events = await res.json();
                
                const grouped = {};
                events.forEach(e => {
                    if (!grouped[e.added_date]) grouped[e.added_date] = [];
                    grouped[e.added_date].push(e);
                });

                const contentDiv = document.getElementById('content');
                contentDiv.innerHTML = '';

                const sortedDates = Object.keys(grouped).sort().reverse();

                sortedDates.forEach(date => {
                    const section = document.createElement('div');
                    section.className = 'bg-slate-800 rounded-xl p-6 border border-slate-700 shadow-lg';
                    
                    let html = `<h2 class="text-xl font-semibold text-emerald-400 mb-4 flex items-center justify-between">
                        <span>📅 Added on: ${date}</span>
                        <span class="text-xs bg-emerald-950 text-emerald-300 px-3 py-1 rounded-full font-mono">${grouped[date].length} events</span>
                    </h2><div class="grid gap-4">`;

                    grouped[date].forEach(ev => {
                        html += `
                            <div class="bg-slate-900 p-4 rounded-lg border border-slate-700/60">
                                <span class="text-xs font-semibold px-2 py-1 bg-indigo-900/60 text-indigo-300 rounded mb-2 inline-block">${ev.date}</span>
                                <h3 class="text-lg font-bold text-white mb-2">${ev.title}</h3>
                                <pre class="text-xs text-slate-400 whitespace-pre-wrap font-sans mb-3">${ev.raw_text}</pre>
                                ${ev.link ? `<a href="${ev.link}" target="_blank" class="text-xs text-blue-400 hover:underline">View Website →</a>` : ''}
                            </div>
                        `;
                    });

                    html += `</div>`;
                    section.innerHTML = html;
                    contentDiv.appendChild(section);
                });
            } catch (err) {
                document.getElementById('content').innerHTML = '<p class="text-amber-400">No events found yet. Run the manual trigger in GitHub Actions to perform the first scrape!</p>';
            }
        }
        fetchEvents();
    </script>
</body>
</html>
